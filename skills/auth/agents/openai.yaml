interface:
  display_name: "Contract CLI Auth"
  short_description: "Configure contract-cli login and switch user/app identities"
  default_prompt: "Use $auth to initialize contract-cli auth, complete user or app login, inspect local auth state, switch default identities, and troubleshoot config or secrets persistence. 不得索要原始凭证，不得无边界枚举接口。"

policy:
  allow_implicit_invocation: true
